# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# OLED display is OFF. It is the single largest power draw on a nice!nano, and
# its battery readout was not worth the cost: ZMK has no fuel gauge and derives
# the percentage from a crude linear voltage approximation.
# Set this back to y if the loss of layer indication turns out to matter.
CONFIG_ZMK_DISPLAY=n

# Battery is still reported, just to the host instead of to a screen.
# ZMK_BATTERY_REPORTING is independent of the display and implies BT_BAS, so
# macOS shows the left half in its Bluetooth menu. PROXY exposes the right half
# as an additional Battery Level service so both halves are visible there.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Deep sleep is deliberately OFF: the keyboard should stay awake and respond
# instantly with no wake delay on the first keypress.
CONFIG_ZMK_SLEEP=n
