# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Battery: show a numeric percentage rather than just an icon.
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Let the central (left) half fetch the peripheral (right) half's battery level,
# so the left OLED can show both.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Deep sleep. ZMK_SLEEP defaults to OFF, which means the board only blanks the
# OLED after ZMK_IDLE_TIMEOUT and otherwise keeps the MCU and BLE radio awake
# indefinitely. Enabling it lets the halves actually power down when idle,
# which is the single largest battery win on a nice!nano with an OLED.
# Tradeoff: a brief wake delay on the first keypress after sleeping.
CONFIG_ZMK_SLEEP=y

# Explicit rather than implicit so both timeouts are visible and tunable.
# Idle (OLED off) after 30s; deep sleep after 15 minutes of inactivity.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
