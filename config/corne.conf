# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Battery: show a numeric percentage rather than just an icon.
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Let the central (left) half fetch the peripheral (right) half's battery level,
# so the left OLED can show both.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Deep sleep is deliberately OFF: the keyboard should stay awake and respond
# instantly. Only the OLED sleeps, which is what ZMK_IDLE_TIMEOUT controls.
CONFIG_ZMK_SLEEP=n

# OLED blanks after this much inactivity. Lower it to save more power; the
# screen is only glanced at right after a keypress anyway.
CONFIG_ZMK_IDLE_TIMEOUT=30000
